[package]
name = "timetable"
version = "0.1.0"
description = "课程表"
edition = "2021"

[lib]
name = "timetable_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
calamine = "0.26"
csv = "1"
encoding_rs = "0.8"
