name: Build Tauri App All

# 触发方式：
# 1. 手动触发（在 GitHub 仓库的 Actions 页面点 "Run workflow"）
# 2. push 一个 v 开头的 tag 时自动触发，例如 git tag v0.1.0 && git push --tags
on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
          - platform: macos-latest

    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v4

      # Linux 编译 Tauri 需要 webkit2gtk 等系统依赖
      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Install tauri-cli
        run: cargo install tauri-cli --version "^2" --locked

      - name: Build app
        run: cargo tauri build

      # 把编译好的安装包上传成 Actions 的构建产物，运行完成后可在页面下载
      - name: Upload artifacts (Windows)
        if: matrix.platform == 'windows-latest'
        uses: actions/upload-artifact@v4
        with:
          name: timetable-windows
          path: |
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/nsis/*.exe

      - name: Upload artifacts (macOS)
        if: matrix.platform == 'macos-latest'
        uses: actions/upload-artifact@v4
        with:
          name: timetable-macos
          path: src-tauri/target/release/bundle/dmg/*.dmg

